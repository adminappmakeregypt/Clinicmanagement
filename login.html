<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BookMyDoctor - تسجيل الدخول</title>
  <link rel="icon" type="image/jpeg" href="logo.jpg" />
  <link rel="stylesheet" href="styles.css" />
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    .auth-wrap { max-width: 460px; margin: 40px auto; }
    .link-btn {
      background: none; border: none; color: #2563eb; cursor: pointer;
      font: inherit; padding: 0; text-decoration: underline;
    }
    .forgot-row { text-align: center; margin-top: 10px; font-size: 14px; }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div class="container auth-wrap">
    <header class="page-header app-header" style="justify-content:center;">
      <div class="brand" style="flex-direction:column; align-items:center; text-align:center;">
        <img src="logo.jpg" alt="BookMyDoctor" class="brand-logo" />
        <div class="brand-text" style="text-align:center;">
          <h1>BookMyDoctor</h1>
          <p class="brand-tagline" id="brandTagline">تسجيل الدخول إلى حسابك</p>
        </div>
      </div>
    </header>

    <!-- Login form -->
    <section class="card" id="loginCard">
      <form id="loginForm" autocomplete="on">
        <div class="field"><label>البريد الإلكتروني</label><input type="email" id="loginEmail" required /></div>
        <div class="field"><label>كلمة المرور</label><input type="password" id="loginPassword" required /></div>
        <div class="actions"><button class="btn primary" type="submit">دخول</button></div>
        <div class="forgot-row">
          <button type="button" class="link-btn" id="showResetBtn">نسيت كلمة المرور؟</button>
        </div>
      </form>
    </section>

    <!-- Reset password form -->
    <section class="card hidden" id="resetCard">
      <h3 style="margin-top:0;text-align:center;">إعادة تعيين كلمة المرور</h3>
      <p style="text-align:center;color:#666;font-size:14px;margin-top:0;">
        أدخل بريدك الإلكتروني وكلمة المرور الجديدة لحفظها.
      </p>
      <form id="resetForm" autocomplete="off">
        <div class="field"><label>البريد الإلكتروني</label><input type="email" id="resetEmail" required /></div>
        <div class="field"><label>كلمة المرور الجديدة</label><input type="password" id="resetNewPw" minlength="6" required /></div>
        <div class="field"><label>تأكيد كلمة المرور الجديدة</label><input type="password" id="resetConfirmPw" minlength="6" required /></div>
        <div class="actions" style="gap:8px;">
          <button class="btn primary" type="submit">حفظ كلمة المرور الجديدة</button>
          <button class="btn ghost" type="button" id="backToLoginBtn">رجوع</button>
        </div>
      </form>
    </section>
  </div>

  <script src="auth.js"></script>
  <script>
    const $ = (s) => document.querySelector(s);
    function toast(msg) {
      let el = document.querySelector('.toast');
      if (!el) { el = document.createElement('div'); el.className = 'toast'; document.body.appendChild(el); }
      el.textContent = msg; el.classList.add('show');
      clearTimeout(window._t); window._t = setTimeout(() => el.classList.remove('show'), 2500);
    }

    const loginCard = $('#loginCard');
    const resetCard = $('#resetCard');
    const tagline = $('#brandTagline');

    $('#showResetBtn').addEventListener('click', () => {
      loginCard.classList.add('hidden');
      resetCard.classList.remove('hidden');
      tagline.textContent = 'إعادة تعيين كلمة المرور';
      const em = $('#loginEmail').value.trim();
      if (em) $('#resetEmail').value = em;
    });
    $('#backToLoginBtn').addEventListener('click', () => {
      resetCard.classList.add('hidden');
      loginCard.classList.remove('hidden');
      tagline.textContent = 'تسجيل الدخول إلى حسابك';
    });

    $('#loginForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const email = $('#loginEmail').value.trim().toLowerCase();
      const pw = $('#loginPassword').value;
      try {
        window.BMDAuth.signIn(email, pw);
        location.href = 'home.html';
      } catch (err) { toast(err.message || 'فشل الدخول'); }
    });

    $('#resetForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const email = $('#resetEmail').value.trim().toLowerCase();
      const newPw = $('#resetNewPw').value;
      const confirmPw = $('#resetConfirmPw').value;
      if (newPw !== confirmPw) { toast('كلمتا المرور غير متطابقتين'); return; }
      try {
        window.BMDAuth.resetPassword(email, newPw);
        toast('تم حفظ كلمة المرور الجديدة، سجّل الدخول الآن');
        $('#resetForm').reset();
        resetCard.classList.add('hidden');
        loginCard.classList.remove('hidden');
        tagline.textContent = 'تسجيل الدخول إلى حسابك';
        $('#loginEmail').value = email;
        $('#loginPassword').focus();
      } catch (err) { toast(err.message || 'فشل تغيير كلمة المرور'); }
    });

    if (window.BMDAuth && window.BMDAuth.getSession()) {
      location.replace('home.html');
    }
  </script>
</body>
</html>
